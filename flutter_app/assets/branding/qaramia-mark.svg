<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="peekuu mark — P">
  <defs>
    <!-- Stem: sunrise gradient (gold → peach → rose) — radiance.
         userSpaceOnUse so it paints on the vertical stem, whose object
         bounding box has zero width. -->
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="124" y1="72" x2="124" y2="248">
      <stop offset="0%"   stop-color="#FFD166"/>
      <stop offset="45%"  stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#E94560"/>
    </linearGradient>

    <!-- Bowl: rose-to-crimson — love -->
    <linearGradient id="cgrad" x1="25%" y1="10%" x2="75%" y2="90%">
      <stop offset="0%"   stop-color="#FF6B81"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </linearGradient>

    <!-- Soft halo for radiance behind the mark -->
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#FFD166" stop-opacity="0.45"/>
      <stop offset="40%"  stop-color="#FF8A5C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF7043" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner glow behind the bowl's warmth -->
    <radialGradient id="cglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFB3C1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C9184A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Radiant halo -->
  <circle cx="160" cy="160" r="155" fill="url(#halo)"/>

  <!-- Soft glow behind the bowl -->
  <circle cx="150" cy="130" r="48" fill="url(#cglow)"/>

  <!-- P bowl FIRST — semicircle off the top of the stem, bulging right.
       The stem (drawn next) sits on top so the junction stays clean. -->
  <path d="M 124 72 A 58 58 0 0 1 124 188"
        fill="none"
        stroke="url(#cgrad)"
        stroke-width="30"
        stroke-linecap="round"/>

  <!-- P stem ON TOP — vertical rounded stroke -->
  <line x1="124" y1="72" x2="124" y2="248" stroke="url(#ring)" stroke-width="30" stroke-linecap="round"/>
</svg>
