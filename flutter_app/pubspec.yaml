name: streamr
description: "Qaramia — every product mentioned, seen or heard, is a purchase opportunity"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_database: ^11.1.4   # Realtime DB for danmaku
  cloud_functions: ^5.1.3

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Live streaming
  agora_rtc_engine: ^6.3.2

  # Video playback
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Auth
  google_sign_in: ^6.2.2

  # UI / UX
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.10           # render the Qaramia mark
  google_fonts: ^6.2.1           # Playfair Display for the italic wordmark

  # HTTP
  dio: ^5.7.0

  # Utilities
  intl: ^0.19.0
  timeago: ^3.7.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/branding/
